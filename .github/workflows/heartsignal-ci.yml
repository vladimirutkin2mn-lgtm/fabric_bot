name: HeartSignal CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: ideas/ai-relationship-platform

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heartsignal_test
          POSTGRES_USER: heartsignal
          POSTGRES_PASSWORD: heartsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartsignal -d heartsignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://heartsignal:heartsignal@localhost:5432/heartsignal_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ideas/ai-relationship-platform/pyproject.toml

      - name: Install project and development dependencies
        run: pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check app tests migrations

      - name: Lint
        run: ruff check app tests migrations

      - name: Type-check
        run: mypy app tests

      - name: Validate Alembic migration chain
        env:
          DATABASE_URL: postgresql+asyncpg://heartsignal:heartsignal@localhost:5432/heartsignal_test
          TELEGRAM_BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CONTENT_ENCRYPTION_KEY: ci-only-key
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Test
        run: pytest

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag heartsignal:ci .
